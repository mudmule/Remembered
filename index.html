<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Remembered"><meta name="theme-color" content="#9c5965"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Remembered</title><style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#302b2b;--muted:#766e6e;--rose:#9c5965;--line:#e9dfd8;--green:#587765}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:calc(18px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;background:rgba(247,243,238,.94);backdrop-filter:blur(12px);z-index:5}h1{margin:0;font-family:Georgia,serif;font-size:34px}.sub{color:var(--muted);margin-top:3px}.wrap{max-width:760px;margin:auto;padding:4px 14px 100px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:22px 4px 10px}.sectionTitle h2{font:700 21px Georgia,serif;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 4px 18px #5c40330c;display:grid;grid-template-columns:76px 1fr;gap:14px}.photo{width:76px;height:76px;border-radius:18px;background:#eee5df;object-fit:cover;display:grid;place-items:center;font-size:32px}.name{font-size:21px;font-weight:750}.meta,.small{color:var(--muted);font-size:14px}.counter{font-weight:700;margin-top:7px}.gone{color:var(--rose)}.living{color:var(--green)}button,.btn{border:0;border-radius:13px;padding:11px 14px;background:#3d3838;color:white;font-weight:700;font-size:15px}.ghost{background:#eee6e0;color:#443d3d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 3px}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end}.sheet{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9cec7;border-radius:12px;background:white;font:inherit}.field textarea{min-height:90px}.full{grid-column:1/-1}.sheetActions{display:flex;gap:8px;position:sticky;top:-18px;background:var(--bg);padding:5px 0 10px}.empty{padding:24px;text-align:center;color:var(--muted)}.detail{margin-top:7px;font-size:14px}.heart{color:var(--rose)}@media(max-width:480px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}

body{background:radial-gradient(circle at 80% 8%,#30143d 0,#160d20 34%,#09070d 78%)!important;color:#f4eadb!important}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#120b19aa,#09070dcc);z-index:-1}
header{background:rgba(15,16,23,.86)!important;border-bottom:1px solid #8b4ea34d}
h1{color:#f3dfbd;text-shadow:0 2px 5px #000}.sub{color:#ddcbb2!important}
.wrap{max-width:900px}.sectionTitle{background:#171820e8;border:1px solid #8b4ea355;border-radius:16px;padding:10px 13px}
.sectionTitle h2{color:#f3dfbd!important;font-size:24px!important}
.card{background:linear-gradient(110deg,#fffaf1f7,#eadbc8f3)!important;color:#302825!important;border-color:#cbb28e!important;box-shadow:0 8px 24px #0007!important;grid-template-columns:76px 1fr auto!important}
.cardControls{display:flex;gap:7px;align-self:center}.cardControls button{padding:9px 11px;font-size:13px;box-shadow:none}
.editCard{background:#2a1637}.deleteCard{background:#8d171c;color:#fff3df;border:1px solid #cbb28e}
.actions button,.actions .btn{border:1px solid #8b4ea377;box-shadow:0 4px 12px #0005}
@media(max-width:600px){body{}.card{grid-template-columns:64px 1fr!important}.photo{width:64px!important;height:64px!important}.cardControls{grid-column:1/-1;justify-content:flex-end;border-top:1px solid #cdbda8;padding-top:10px}}
</style></head><body><header><h1>Remembered <span class="heart">♥</span></h1><div class="sub">The time we have, and the time we remember.</div></header><main class="wrap"><div class="actions"><button id="addSomeoneBtn" type="button">＋ Add Someone</button><button class="ghost" onclick="backup()">Backup</button><label class="btn ghost">Restore<input id="restore" type="file" accept="application/json" hidden></label></div><section><div class="sectionTitle"><h2>Still With Me ❤️</h2></div><div id="living"></div></section><section><div class="sectionTitle"><h2>Remembered 🕯️</h2></div><div id="remembered"></div></section></main>
<div class="modal" id="modal"><div class="sheet"><div class="sheetActions"><button onclick="saveEditor()">Save</button><button class="ghost" onclick="closeEditor()">Cancel</button><button id="deleteBtn" class="ghost" onclick="deleteEditor()">Delete</button></div><h2 id="editTitle">Add Someone</h2><div class="grid"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Type</label><select id="type"><option>Person</option><option>Pupper</option><option>Pet</option></select></div><div class="field"><label>Birthday</label><input id="birth" type="date"></div><div class="field"><label>Date of death (leave blank if living)</label><input id="death" type="date"></div><div class="field full"><label>Relationship / connection</label><input id="relation" placeholder="Example: Fred's littermate"></div><div class="field full"><label>Photo</label><input id="photo" type="file" accept="image/*"></div><div class="field full"><label>Memories / notes</label><textarea id="notes"></textarea></div></div></div></div>
<script>
const KEY='remembered.records.v1'; let editId=null, pendingPhoto=null;
const seed=[
{id:'mom',name:'Mom',type:'Person',birth:'1951-11-18',death:'2022-10-16',relation:'Mom',notes:'',photo:''},
{id:'beamer',name:'Beamer',type:'Pupper',birth:'2011-11-01',death:'2025-02-25',relation:'',notes:'',photo:''},
{id:'fred',name:'Fred',type:'Pupper',birth:'2020-12-09',death:'2026-06-29',relation:'George’s littermate',notes:'',photo:''},
{id:'george',name:'George',type:'Pupper',birth:'2020-12-09',death:'',relation:'Fred’s littermate',notes:'',photo:''}
];
function records(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:seed}catch{return seed}}
function store(x){try{localStorage.setItem(KEY,JSON.stringify(x));render();return true}catch(e){alert('The browser could not save this entry. The photo may be too large.');return false}}
if(!localStorage.getItem(KEY)) store(seed);
function d(s){let [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
function ymdBetween(a,b){let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),days=b.getDate()-a.getDate();if(days<0){m--;let prev=new Date(b.getFullYear(),b.getMonth(),0);days+=prev.getDate()}if(m<0){y--;m+=12}return {y,m,d:days}}
function fmtSpan(x){let p=[];if(x.y)p.push(`${x.y} year${x.y==1?'':'s'}`);if(x.m||x.y)p.push(`${x.m} month${x.m==1?'':'s'}`);p.push(`${x.d} day${x.d==1?'':'s'}`);return p.join(', ')}
function totalDays(a,b){return Math.floor((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)}
function fmtDate(s){return d(s).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}
function nextAnniv(s){let x=d(s),now=new Date(),n=new Date(now.getFullYear(),x.getMonth(),x.getDate());if(n<new Date(now.getFullYear(),now.getMonth(),now.getDate()))n.setFullYear(n.getFullYear()+1);return {date:n,days:totalDays(new Date(now.getFullYear(),now.getMonth(),now.getDate()),n)}}
function card(r){
 let now=new Date(),born=D(r.birth),end=r.death?D(r.death):now,age=spanText(span(born,end)),icon=r.type==='Person'?'♥':'🐾';
 let img=r.photo?'<img class="photo" src="'+r.photo+'" alt="">':'<div class="photo">'+icon+'</div>';
 let body='';
 if(r.death){
   let death=D(r.death),days=dayDiff(death,now),until=anniv(r.death);
   body='<div class="counter">We had '+age+' together</div>'+
        '<div class="counter gone">'+spanText(span(death,now))+' since goodbye</div>'+
        '<div class="detail">'+days.toLocaleString()+' days remembered • Anniversary: '+death.toLocaleDateString(undefined,{month:"long",day:"numeric"})+' • '+until+' day'+(until===1?'':'s')+' away</div>';
 }else{
   let bd=D(r.birth),until=anniv(r.birth);
   body='<div class="counter living">'+age+' old today</div>'+
        '<div class="detail">Next birthday: '+bd.toLocaleDateString(undefined,{month:"long",day:"numeric"})+' • '+until+' day'+(until===1?'':'s')+' away</div>';
 }
 let notes=r.notes?'<div class="notePreview"><strong>Memory:</strong> '+esc(r.notes)+'</div>':'';
 return '<article class="card">'+img+'<div><div class="name">'+esc(r.name)+'</div><div class="meta">Born '+fmt(r.birth)+(r.death?' • Died '+fmt(r.death):'')+'</div>'+(r.relation?'<div class="small">'+esc(r.relation)+'</div>':'')+body+notes+'</div><div class="cardBtns"><button class="editBtn" data-edit="'+r.id+'">✎ Edit</button><button class="delBtn" data-del="'+r.id+'">🗑 Delete</button></div></article>'
}
function render(){let x=records();document.getElementById('living').innerHTML=x.filter(r=>!r.death).map(card).join('')||'<div class="empty">No living entries yet.</div>';document.getElementById('remembered').innerHTML=x.filter(r=>r.death).map(card).join('')||'<div class="empty">No remembered entries yet.</div>'}
function openEditor(id=null){editId=id;pendingPhoto=null;let r=id?records().find(x=>x.id===id):{name:'',type:'Pupper',birth:'',death:'',relation:'',notes:'',photo:''};['name','type','birth','death','relation','notes'].forEach(k=>document.getElementById(k).value=r[k]||'');document.getElementById('editTitle').textContent=id?'Edit '+r.name:'Add Someone';document.getElementById('deleteBtn').style.display=id?'block':'none';document.getElementById('photo').value='';document.getElementById('modal').style.display='flex'}
function closeEditor(){document.getElementById('modal').style.display='none'}
function resizePhoto(file){return new Promise((resolve,reject)=>{let rd=new FileReader();rd.onerror=reject;rd.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=rd.result};rd.readAsDataURL(file)})}
document.getElementById('photo').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{pendingPhoto=await resizePhoto(f)}catch(_){pendingPhoto=null;alert('I could not prepare that photo. Please try another image.')}});
function saveEditor(){let name=document.getElementById('name').value.trim(),birth=document.getElementById('birth').value;if(!name||!birth){alert('Name and birthday are required.');return}let x=records(),old=editId?x.find(r=>r.id===editId):null,r={id:editId||('r'+Date.now()+'x'+Math.floor(Math.random()*1000000)),name:name,type:document.getElementById('type').value,birth:birth,death:document.getElementById('death').value,relation:document.getElementById('relation').value.trim(),notes:document.getElementById('notes').value.trim(),photo:pendingPhoto||((old&&old.photo)||'')};if(editId)x=x.map(q=>q.id===editId?r:q);else x.push(r);if(store(x))closeEditor()}
function deleteDirect(id){let r=records().find(x=>x.id===id);if(r&&confirm(`Delete ${r.name}? This cannot be undone unless you have a backup.`)){store(records().filter(x=>x.id!==id));}}
function deleteEditor(){if(!editId)return;let r=records().find(x=>x.id===editId);if(confirm(`Delete ${r.name}?`)){store(records().filter(x=>x.id!==editId));closeEditor()}}
function backup(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),records:records()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Remembered-Backup.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('restore').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let j=JSON.parse(rd.result),x=Array.isArray(j)?j:j.records;if(!Array.isArray(x))throw 0;if(confirm('Replace the current Remembered data with this backup?'))store(x)}catch{alert('That does not appear to be a Remembered backup.')}};rd.readAsText(f)});
document.getElementById('addSomeoneBtn').addEventListener('click',function(e){e.preventDefault();openEditor();});
render();setInterval(render,3600000);
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script></body></html>
